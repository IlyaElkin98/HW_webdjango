{% extends 'product/base.html' %}
{% block title %}Список категория{% endblock %}
{% block content %}
{% include 'product/header.html' %}
<h1 class="mb-4">Список категорий</h1>
{% for category in categories %}
    <div class="card mb-3" style="max-width: 1200px">
        <div class="row g-0">
            <div class="col-md-8">
                <div class="card-body">
                    <a href="{% url 'product:products_by_category' category.id %}">{{ category.name }}</a>
                </div>
            </div>
        </div>
    </div>
{% endfor %}
{% endblock %}
